name: Deploy Vite to Github Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Setup Nodejs
      - name: Setup Nodejs
        uses: actions/setup-node@v3
        with:
          node-version: 18
        
      # Install Dependencies
      - name: Install Dependencies
        run: npm install

      # Build Project
      - name: Build Project
        run: npm run build

      # Deploy App
      - name: Deploy App
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

